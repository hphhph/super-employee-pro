# AI超级员工 · nginx 站点配置
# 由 deploy.sh 自动生成到 /etc/nginx/conf.d/super-employee.conf
# 占位符: {{WEB_ROOT}} 前端构建产物目录, {{DOMAIN}} 域名(空则匹配任意)

# ---- 全局 gzip 压缩 ----
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

server {
    listen 80;
    server_name {{DOMAIN}};

    # 前端静态资源（vite 构建产物）
    root {{WEB_ROOT}};
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（dist/assets/ 文件名带 hash，可安全缓存）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 后端 API（保留 /api 前缀，后端全局前缀为 /api）
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 WebSocket（预留，目前系统未使用）
    location /ws {
        proxy_pass http://127.0.0.1:3000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 后端 Swagger 文档（生产默认关闭，SWAGGER_ENABLED=true 时生效）
    location /docs {
        proxy_pass http://127.0.0.1:3000/docs;
    }
}
